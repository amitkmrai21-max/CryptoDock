name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Each build gets a higher version so Play Store accepts it as an update.
      VERSION_CODE: ${{ github.run_number }}
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Capacitor deps and scaffold Android
        working-directory: mobile-app
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Deep link for Google sign-in (com.cryptodock.app://auth-callback)
        working-directory: mobile-app/android
        run: |
          python3 - <<'PY'
          path = "app/src/main/AndroidManifest.xml"
          text = open(path).read()
          if 'android:host="auth-callback"' not in text:
              link = """
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.cryptodock.app" android:host="auth-callback" />
                      </intent-filter>"""
              text = text.replace("</intent-filter>", "</intent-filter>" + link, 1)
              open(path, "w").write(text)
          PY
          grep -n "auth-callback\|launchMode" app/src/main/AndroidManifest.xml

      - name: App icon and splash from mobile-app/assets
        working-directory: mobile-app
        run: npx --yes @capacitor/assets@3 generate --android

      - name: Set version
        working-directory: mobile-app/android
        run: |
          sed -i "s/versionCode 1$/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${VERSION_CODE}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle

      - name: Build debug APK (install directly for testing)
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ./gradlew assembleDebug

      - name: Build signed release AAB (for Play Store)
        if: env.HAS_SIGNING_KEY == 'true'
        working-directory: mobile-app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: No signing key yet
        if: env.HAS_SIGNING_KEY != 'true'
        run: echo "::warning::Add the ANDROID_KEYSTORE_* secrets to also build the signed Play Store bundle (.aab)."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cryptodock-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store bundle
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cryptodock-release-aab
          path: mobile-app/android/app/build/outputs/bundle/release/app-release.aab
